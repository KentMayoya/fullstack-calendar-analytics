name: Hourly Calendar Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  call-api-job:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Send signed request to backend
        env:
          CRON_SECRET: ${{ secrets.X_CRON_SECRET }}
          TARGET_URL: "https://fullstack-calendar-analytics.onrender.com/api/v1/calendars/sync-all"
        run: |
          timestamp=$(date +%s)
          signature=$(echo -n "$timestamp" | openssl dgst -sha256 -hmac "$CRON_SECRET" -binary | xxd -p -c 256)
          curl -X POST "$TARGET_URL" \
          -H "Content-Type: application/json" \
          -H "X-Request-Timestamp: $timestamp" \
          -H "X-Signature-256: $signature"
